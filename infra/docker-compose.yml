name: hoico

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hoico
      POSTGRES_PASSWORD: hoico
      POSTGRES_DB: hoico
    ports:
      - "5432:5432"
    volumes:
      - hoico_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-airflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoico -d hoico"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["core", "full"]

  pipeline:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      HOICO_ROOT: /srv
      HOICO_DATABASE_URL: postgresql+psycopg://hoico:hoico@postgres:5432/hoico
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hoico
      POSTGRES_USER: hoico
      POSTGRES_PASSWORD: hoico
      MLFLOW_TRACKING_URI: file:/srv/mlruns
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ../data:/srv/data
      - ../app/data:/srv/app/data
      - ../docs:/srv/docs
      - ../mlruns:/srv/mlruns
      - ../src:/srv/src
      - ../transformations:/srv/transformations
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["core", "full"]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "uvicorn", "hoico.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HOICO_ROOT: /srv
      HOICO_DATABASE_URL: postgresql+psycopg://hoico:hoico@postgres:5432/hoico
    ports:
      - "8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    profiles: ["core", "full"]

  web:
    build:
      context: ../app
      dockerfile: Dockerfile
    environment:
      HOICO_SNAPSHOT_PATH: /web/data/public-snapshot.json
      HOICO_API_URL: http://api:8000
    volumes:
      - ../app/data:/web/data
    ports:
      - "3000:3000"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    profiles: ["core", "full"]

  mlflow:
    image: hoico-pipeline:latest
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "mlflow", "ui", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "file:/srv/mlruns"]
    volumes:
      - ../mlruns:/srv/mlruns
    ports:
      - "5000:5000"
    profiles: ["full"]

  airflow-init:
    image: hoico-airflow:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://hoico:hoico@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: nd8ho4CseukGm0kwMjZUOeUNx13ODpC-SBD4vhDEZBA=
      AIRFLOW__WEBSERVER__SECRET_KEY: hoico-local-demo-secret
      HOICO_ROOT: /opt/hoico
      HOICO_DATABASE_URL: postgresql+psycopg://hoico:hoico@postgres:5432/hoico
      POSTGRES_HOST: postgres
      MLFLOW_TRACKING_URI: file:/opt/hoico/mlruns
      GIT_PYTHON_REFRESH: quiet
    volumes: &airflow-volumes
      - ../orchestration/airflow/dags:/opt/airflow/dags
      - ../src:/opt/hoico/src
      - ../data:/opt/hoico/data
      - ../docs:/opt/hoico/docs
      - ../app/data:/opt/hoico/app/data
      - ../mlruns:/opt/hoico/mlruns
      - ../transformations:/opt/hoico/transformations
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow --firstname HOICO --lastname Demo --role Admin --email airflow@example.com || true
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  airflow-webserver:
    image: hoico-airflow:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    command: webserver
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    profiles: ["full"]

  airflow-scheduler:
    image: hoico-airflow:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    command: scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    profiles: ["full"]

volumes:
  hoico_pg:

[project]
name = "hoico"
version = "1.0.0"
description = "Hospital Operations Intelligence and Capacity Optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.2.6",
  "pyarrow==17.0.0",
  "pyspark==3.5.5",
  "setuptools==75.8.0",
  "delta-spark==3.2.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "pydantic==2.10.4",
  "statsmodels==0.14.4",
  "scikit-learn==1.5.2",
  "lightgbm==4.5.0",
  "mlflow==2.17.2",
  "pulp==2.9.0",
  "dbt-core==1.8.8",
  "dbt-postgres==1.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "ruff>=0.7.4", "httpx>=0.27.2"]

[project.scripts]
hoico = "hoico.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a reachable Postgres database",
  "spark: needs a local JVM",
]
